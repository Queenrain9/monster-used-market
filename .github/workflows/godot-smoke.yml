name: Godot smoke test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.5.1
        run: |
          curl -L "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.5.1-stable_linux.x86_64

      - name: Parse project headlessly
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Run core smoke test
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . -s res://tests/core_smoke_test.gd
