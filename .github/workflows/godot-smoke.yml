name: Godot smoke test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.5.1
        run: |
          curl -L "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.5.1-stable_linux.x86_64

      - name: Import supplied textures
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --import

      - name: Check content syntax
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --check-only --script res://data/content.gd

      - name: Check game logic syntax
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/game_logic.gd

      - name: Check main syntax
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/main.gd

      - name: Boot main scene
        run: |
          set +e
          OUTPUT=$(./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --quit-after 2 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ $CODE -ne 0 ]; then
            exit $CODE
          fi
          if echo "$OUTPUT" | grep -Eq "SCRIPT ERROR|ERROR:"; then
            exit 1
          fi

      - name: Run core smoke test
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . -s res://tests/core_smoke_test.gd

      - name: Run release balance simulation
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . -s res://tests/release_balance_test.gd

      - name: Run home feed and portrait regression test
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/monster-smoke-data
          MONSTER_SMOKE_DATA_ROOT: ${{ runner.temp }}/monster-smoke-data
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . -s res://tests/home_feed_smoke_test.gd

      - name: Verify artwork catalog and replacements
        run: ./.godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . -s res://tests/art_smoke_test.gd
